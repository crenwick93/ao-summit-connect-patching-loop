---
# ServiceNow change request management for patching loop.
# Uses NORMAL change requests (not emergency) — the approval gate is the booth demo engagement point.
#
# Actions:
#   create    — Create normal CR for patching approval gate.
#               Publishes cr_sys_id and cr_number via set_stats.
#   update    — Add work notes to an existing CR.
#   review    — Move CR to review state.
#   close     — Close the CR.
#
# Usage from AO workflow extra_vars:
#   { "action": "create", "current_group": "A" }
#   { "action": "update", "cr_sys_id": "...", "work_notes": "..." }
#   { "action": "close", "cr_sys_id": "...", "close_notes": "..." }

- name: Manage ServiceNow Change Request
  hosts: localhost
  connection: local
  gather_facts: false

  environment:
    SN_TIMEOUT: "20"

  tasks:
    - name: Validate action
      ansible.builtin.assert:
        that:
          - action is defined
          - action in ['create', 'update', 'review', 'close']
        fail_msg: "action must be one of: create, update, review, close"

    # =========================================================================
    # ACTION: create
    # =========================================================================
    - name: Create emergency Change Request for patching approval
      servicenow.itsm.change_request:
        type: emergency
        state: new
        short_description: >-
          CVE Remediation — {{ cve_id | default('CVE-2021-4034') }}
          (Group {{ current_group }}) — {{ remediation_route | default('patch') }}
        description: |
          === Change Request ===
          Group: {{ current_group }}
          CVE: {{ cve_id | default('CVE-2021-4034') }}
          Severity: {{ severity | default('N/A') }}
          Advisory: {{ advisory_id | default('N/A') }}
          Route: {{ remediation_route | default('patch') }}
          Target hosts: {{ target_hosts | default('tag_group_' ~ current_group) }}

          === Remediation ===
          Apply {{ remediation_route | default('patch') }} for {{ cve_id | default('CVE-2021-4034') }}
          to Group {{ current_group }} hosts.
          Playbook fetched from Red Hat Lightspeed Remediations API.

          === Workflow ===
          Awaiting approval to proceed.
          After remediation: post-checks, CR closure.
        priority: "{{ cr_priority | default(1) }}"
        risk: "{{ cr_risk | default('low') }}"
        impact: "{{ cr_impact | default(2) }}"
        category: "{{ cr_category | default('Software') }}"
        assignment_group: "{{ cr_assignment_group | default('CAB Approval') }}"
        other:
          justification: "Automated CVE remediation — {{ cve_id | default('CVE-2021-4034') }} ({{ remediation_route | default('patch') }}) for Group {{ current_group }}."
          implementation_plan: "Automated by Ansible Automation Platform and Automation Orchestrator. Remediation playbook fetched from Red Hat Lightspeed."
          backout_plan: "{{ backout_plan | default('dnf history undo last — revert applied packages. Restart affected services.') }}"
          test_plan: "Automated post-checks verify service health and remediation applied on all hosts."
      register: cr_result
      when: action == 'create'

    - name: Transition CR to Authorize and request approval
      servicenow.itsm.change_request:
        number: "{{ cr_result.record.number }}"
        state: authorize
        assignment_group: "{{ cr_assignment_group | default('CAB Approval') }}"
        other:
          approval: requested
          assigned_to: "{{ servicenow_approver | default('admin') }}"
      when: action == 'create'

    - name: Display created CR
      ansible.builtin.debug:
        msg: |
          === Change Request Created ===
          Number: {{ cr_result.record.number }}
          Sys ID: {{ cr_result.record.sys_id }}
          Group: {{ current_group }}
      when: action == 'create'

    - name: Publish CR identifiers
      ansible.builtin.set_stats:
        data:
          cr_sys_id: "{{ cr_result.record.sys_id }}"
          cr_number: "{{ cr_result.record.number }}"
        aggregate: false
      when: action == 'create'

    # =========================================================================
    # ACTION: update
    # =========================================================================
    - name: Validate update parameters
      ansible.builtin.assert:
        that:
          - cr_sys_id is defined
          - cr_sys_id | length > 0
          - work_notes is defined
        fail_msg: "cr_sys_id and work_notes must be provided for update action"
      when: action == 'update'

    - name: Add work notes to CR
      servicenow.itsm.change_request:
        sys_id: "{{ cr_sys_id }}"
        other:
          work_notes: "{{ work_notes }}"
      when: action == 'update'

    - name: Display update confirmation
      ansible.builtin.debug:
        msg: "CR {{ cr_sys_id }} updated with work notes"
      when: action == 'update'

    # =========================================================================
    # ACTION: review
    # =========================================================================
    - name: Validate review parameters
      ansible.builtin.assert:
        that:
          - cr_sys_id is defined
          - cr_sys_id | length > 0
        fail_msg: "cr_sys_id must be provided for review action"
      when: action == 'review'

    - name: Move CR to Review
      servicenow.itsm.change_request:
        sys_id: "{{ cr_sys_id }}"
        state: review
        other:
          work_notes: "{{ work_notes | default('[AUTOMATED] Patching complete — ready for review.') }}"
      when: action == 'review'

    - name: Display review confirmation
      ansible.builtin.debug:
        msg: "CR {{ cr_sys_id }} moved to Review"
      when: action == 'review'

    # =========================================================================
    # ACTION: close
    # =========================================================================
    - name: Validate close parameters
      ansible.builtin.assert:
        that:
          - cr_sys_id is defined
          - cr_sys_id | length > 0
        fail_msg: "cr_sys_id must be provided for close action"
      when: action == 'close'

    - name: Transition CR to Review before closing
      servicenow.itsm.change_request:
        sys_id: "{{ cr_sys_id }}"
        state: review
        other:
          work_notes: "{{ close_notes | default('Remediation cycle complete. Moving to review.') }}"
      when: action == 'close'

    - name: Close CR
      servicenow.itsm.change_request:
        sys_id: "{{ cr_sys_id }}"
        state: closed
        close_code: "{{ cr_close_code | default('successful') }}"
        close_notes: "{{ close_notes | default('Remediation cycle complete. Closed by automated workflow.') }}"
      when: action == 'close'

    - name: Display close confirmation
      ansible.builtin.debug:
        msg: "CR {{ cr_sys_id }} closed"
      when: action == 'close'
