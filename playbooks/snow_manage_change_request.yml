---
# ServiceNow change request management for patching loop.
# Uses NORMAL change requests (not emergency) — the approval gate is the booth demo engagement point.
#
# Actions:
#   create    — Create normal CR for patching approval gate.
#               Publishes cr_sys_id and cr_number via set_stats.
#   update    — Add work notes to an existing CR.
#   review    — Move CR to review state.
#   close     — Close the CR, then recycle the demo environment:
#               soak pause, terminate/relaunch EC2 instances, re-register
#               with Insights, and fire webhook to EDA for next group.
#
# Usage from AO workflow extra_vars:
#   { "action": "create", "current_group": "A" }
#   { "action": "update", "cr_sys_id": "...", "work_notes": "..." }
#   { "action": "close", "cr_sys_id": "...", "current_group": "A" }

- name: Manage ServiceNow Change Request — Patching Loop
  hosts: localhost
  connection: local
  gather_facts: false

  environment:
    SN_TIMEOUT: "20"

  tasks:
    - name: Validate action
      ansible.builtin.assert:
        that:
          - action is defined
          - action in ['create', 'update', 'review', 'close']
        fail_msg: "action must be one of: create, update, review, close"

    # =========================================================================
    # ACTION: create
    # =========================================================================
    - name: Create normal Change Request for patching approval
      servicenow.itsm.change_request:
        type: normal
        state: new
        short_description: "Patching Loop — Group {{ current_group }} — PwnKit Mitigation"
        description: |
          === Patching Loop Change Request ===
          Group: {{ current_group }}
          Target hosts: {{ target_hosts | default('tag_group_' ~ current_group) }}

          === Remediation ===
          Apply PwnKit (CVE-2021-4034) patching to Group {{ current_group }} hosts.
          Playbook fetched from Red Hat Lightspeed Remediations API.

          === Workflow ===
          Awaiting approval to proceed with patching.
          After patching: post-checks, CR closure.
        priority: "{{ cr_priority | default(3) }}"
        risk: "{{ cr_risk | default('low') }}"
        impact: "{{ cr_impact | default(3) }}"
        category: "{{ cr_category | default('Software') }}"
        assignment_group: "{{ cr_assignment_group | default('CAB Approval') }}"
        other:
          justification: "Automated patching loop — PwnKit remediation for Group {{ current_group }}."
          implementation_plan: "Automated by Ansible Automation Platform and Automation Orchestrator. Patching playbook fetched from Red Hat Lightspeed."
          backout_plan: "rmmod stap_pkexec_block && rm -f /root/pkexec-block.stp /root/pkexec-block.log"
          test_plan: "Automated post-checks verify service health and patching applied on all hosts."
      register: cr_result
      when: action == 'create'

    - name: Transition CR to Authorize and request approval
      servicenow.itsm.change_request:
        number: "{{ cr_result.record.number }}"
        state: authorize
        assignment_group: "{{ cr_assignment_group | default('CAB Approval') }}"
        other:
          approval: requested
          assigned_to: "{{ servicenow_approver | default('admin') }}"
      when: action == 'create'

    - name: Display created CR
      ansible.builtin.debug:
        msg: |
          === Change Request Created ===
          Number: {{ cr_result.record.number }}
          Sys ID: {{ cr_result.record.sys_id }}
          Group: {{ current_group }}
      when: action == 'create'

    - name: Publish CR identifiers
      ansible.builtin.set_stats:
        data:
          cr_sys_id: "{{ cr_result.record.sys_id }}"
          cr_number: "{{ cr_result.record.number }}"
        aggregate: false
      when: action == 'create'

    # =========================================================================
    # ACTION: update
    # =========================================================================
    - name: Validate update parameters
      ansible.builtin.assert:
        that:
          - cr_sys_id is defined
          - cr_sys_id | length > 0
          - work_notes is defined
        fail_msg: "cr_sys_id and work_notes must be provided for update action"
      when: action == 'update'

    - name: Add work notes to CR
      servicenow.itsm.change_request:
        sys_id: "{{ cr_sys_id }}"
        other:
          work_notes: "{{ work_notes }}"
      when: action == 'update'

    - name: Display update confirmation
      ansible.builtin.debug:
        msg: "CR {{ cr_sys_id }} updated with work notes"
      when: action == 'update'

    # =========================================================================
    # ACTION: review
    # =========================================================================
    - name: Validate review parameters
      ansible.builtin.assert:
        that:
          - cr_sys_id is defined
          - cr_sys_id | length > 0
        fail_msg: "cr_sys_id must be provided for review action"
      when: action == 'review'

    - name: Move CR to Review
      servicenow.itsm.change_request:
        sys_id: "{{ cr_sys_id }}"
        state: review
        other:
          work_notes: "{{ work_notes | default('[AUTOMATED] Patching complete — ready for review.') }}"
      when: action == 'review'

    - name: Display review confirmation
      ansible.builtin.debug:
        msg: "CR {{ cr_sys_id }} moved to Review"
      when: action == 'review'

    # =========================================================================
    # ACTION: close
    # =========================================================================
    - name: Validate close parameters
      ansible.builtin.assert:
        that:
          - cr_sys_id is defined
          - cr_sys_id | length > 0
        fail_msg: "cr_sys_id must be provided for close action"
      when: action == 'close'

    - name: Close CR
      servicenow.itsm.change_request:
        sys_id: "{{ cr_sys_id }}"
        state: closed
        close_code: "{{ cr_close_code | default('successful') }}"
        close_notes: "{{ close_notes | default('Patching loop cycle complete. Closed by automated workflow.') }}"
      when: action == 'close'

    - name: Display close confirmation
      ansible.builtin.debug:
        msg: "CR {{ cr_sys_id }} closed"
      when: action == 'close'

# =============================================================================
# Demo recycling — only runs during close action.
# Soak, terminate/relaunch EC2 instances, register with Insights, fire next group.
# =============================================================================

- name: Soak and reset group for next cycle
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    _group: "{{ current_group | upper }}"
    _aws_region: "{{ aws_region | default(lookup('env', 'AWS_REGION')) | default('eu-west-1', true) }}"
    _base_ami: "{{ base_ami_id | default(lookup('env', 'AWS_BASE_AMI_ID')) }}"
    _instance_type: "{{ instance_type | default(lookup('env', 'AWS_INSTANCE_TYPE')) | default('t3.micro', true) }}"
    _subnet_id: "{{ subnet_id | default(lookup('env', 'AWS_SUBNET_ID')) }}"
    _sg_id: "{{ security_group_id | default(lookup('env', 'AWS_SECURITY_GROUP_ID')) }}"
    _key_pair: "{{ key_pair_name | default(lookup('env', 'AWS_KEY_PAIR_NAME')) | default('patching-loop', true) }}"
    _rh_org_id: "{{ rh_org_id | default(lookup('env', 'RH_ORG_ID')) }}"
    _rh_activation_key: "{{ rh_activation_key | default(lookup('env', 'RH_ACTIVATION_KEY')) }}"
    _group_hosts:
      A: ["patch-loop-a1", "patch-loop-a2", "patch-loop-a3"]
      B: ["patch-loop-b1", "patch-loop-b2", "patch-loop-b3"]
      C: ["patch-loop-c1", "patch-loop-c2", "patch-loop-c3"]

  tasks:
    - name: Skip recycling if not a close action
      ansible.builtin.meta: end_play
      when: action | default('') != 'close'

    - name: "Soak period — wait before recycling Group {{ _group }}"
      ansible.builtin.pause:
        seconds: "{{ soak_seconds | default(180) }}"

    - name: "Find running instances for Group {{ _group }}"
      amazon.aws.ec2_instance_info:
        region: "{{ _aws_region }}"
        filters:
          "tag:demo": patching-loop
          "tag:group": "{{ _group }}"
          instance-state-name: running
      register: existing_instances

    - name: Display instances to terminate
      ansible.builtin.debug:
        msg: "Found {{ existing_instances.instances | length }} running instances for Group {{ _group }}"

    - name: "Terminate Group {{ _group }} instances"
      amazon.aws.ec2_instance:
        region: "{{ _aws_region }}"
        instance_ids: "{{ existing_instances.instances | map(attribute='instance_id') | list }}"
        state: terminated
        wait: true
      when: existing_instances.instances | length > 0

    - name: Wait for termination to complete
      ansible.builtin.pause:
        seconds: 10
      when: existing_instances.instances | length > 0

    - name: "Launch 3 new instances for Group {{ _group }}"
      amazon.aws.ec2_instance:
        region: "{{ _aws_region }}"
        image_id: "{{ _base_ami }}"
        instance_type: "{{ _instance_type }}"
        key_name: "{{ _key_pair }}"
        vpc_subnet_id: "{{ _subnet_id }}"
        security_group: "{{ _sg_id }}"
        network:
          assign_public_ip: true
        tags:
          Name: "{{ item }}"
          demo: patching-loop
          group: "{{ _group }}"
        wait: true
        state: running
      loop: "{{ _group_hosts[_group] }}"
      register: new_instances

    - name: Wait for SSH to come up on new instances
      ansible.builtin.wait_for:
        host: "{{ item.instances[0].public_ip_address }}"
        port: 22
        delay: 10
        timeout: 300
        state: started
      loop: "{{ new_instances.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Add new hosts to in-memory inventory
      ansible.builtin.add_host:
        name: "{{ item.instances[0].public_ip_address }}"
        groups: new_hosts
        ansible_user: ec2-user
        ansible_become: true
        instance_name: "{{ item.item }}"
      loop: "{{ new_instances.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Display reset summary
      ansible.builtin.debug:
        msg: |
          === Group {{ _group }} Reset Complete ===
          Terminated: {{ existing_instances.instances | length }} instances
          Launched: {{ new_instances.results | length }} new instances from AMI {{ _base_ami }}

- name: Register new hosts with Red Hat Insights
  hosts: new_hosts
  become: true
  gather_facts: false

  vars:
    _rh_org_id: "{{ rh_org_id | default(lookup('env', 'RH_ORG_ID')) }}"
    _rh_activation_key: "{{ rh_activation_key | default(lookup('env', 'RH_ACTIVATION_KEY')) }}"

  tasks:
    - name: Skip if not recycling
      ansible.builtin.meta: end_play
      when: action | default('') != 'close'

    - name: Register with RHSM using activation key
      community.general.redhat_subscription:
        state: present
        org_id: "{{ _rh_org_id }}"
        activationkey: "{{ _rh_activation_key }}"
      when: _rh_org_id | length > 0

    - name: Register with Insights
      ansible.builtin.command: insights-client --register
      changed_when: true
      when: _rh_org_id | length > 0

- name: Fire next group — continue the loop
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    _current_group: "{{ current_group | upper }}"
    _group_rotation:
      A: B
      B: C
      C: A
    _next_group: "{{ _group_rotation[_current_group] }}"
    _stop_flag: /tmp/patching-loop-stop
    webhook_base_url: ""
    webhook_path: ""
    webhook_client_id: ""
    webhook_client_secret: ""

  tasks:
    - name: Skip if not recycling
      ansible.builtin.meta: end_play
      when: action | default('') != 'close'

    - name: Check for stop flag
      ansible.builtin.stat:
        path: "{{ _stop_flag }}"
      register: stop_flag_check

    - name: Obtain OAuth token for AO webhook
      ansible.builtin.uri:
        url: "{{ webhook_base_url }}/api/v1/auth/token"
        method: POST
        body_format: form-urlencoded
        body:
          grant_type: client_credentials
          client_id: "{{ webhook_client_id }}"
          client_secret: "{{ webhook_client_secret }}"
        validate_certs: false
        status_code: 200
      register: token_response
      when: not stop_flag_check.stat.exists

    - name: Fire webhook to EDA for next group
      ansible.builtin.uri:
        url: "{{ webhook_base_url }}/api/v1/webhooks/eda/{{ webhook_path }}"
        method: POST
        body_format: json
        headers:
          Authorization: "Bearer {{ token_response.json.access_token }}"
          Content-Type: application/json
        body:
          current_group: "{{ _next_group }}"
        validate_certs: false
        status_code: 202
      register: webhook_response
      when: not stop_flag_check.stat.exists

    - name: Display loop status
      ansible.builtin.debug:
        msg: >-
          {{ 'Loop continues: Group ' ~ _current_group ~ ' → Group ' ~ _next_group
             if not stop_flag_check.stat.exists
             else 'Loop stopped at Group ' ~ _current_group ~ '. Remove ' ~ _stop_flag ~ ' and run start-loop.sh to resume.' }}
