---
- name: Open Incident for Patching Loop Cycle
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:
    - name: Create patching loop incident
      servicenow.itsm.incident:
        state: new
        impact: medium
        urgency: medium
        short_description: >-
          Patching Loop — Group {{ current_group }} Cycle
        description: |
          Automated patching loop cycle for Group {{ current_group }}.

          === Patching Details ===
          Group: {{ current_group }}
          Hosts: {{ target_hosts | default('Determined by inventory group tag_group_' ~ current_group) }}
          Remediation: PwnKit (CVE-2021-4034) systemtap mitigation

          === Workflow ===
          This incident tracks an automated patching cycle:
          1. Fleet assessment (verify hosts are alive)
          2. Pre-checks (system readiness)
          3. Apply PwnKit mitigation (systemtap)
          4. Post-checks (validation)
          5. Reset group (terminate + relaunch from AMI)
          6. Fire next group (continue loop)

          Automated response initiated by Event-Driven Ansible.
        caller: "{{ servicenow_caller | default('admin') }}"
        other:
          category: Software
          subcategory: Operating System
      register: inc_result

    - name: Add initial work note
      servicenow.itsm.incident:
        sys_id: "{{ inc_result.record.sys_id }}"
        state: 2
        other:
          work_notes: |
            [AUTOMATED] Patching loop cycle started for Group {{ current_group }}.

            Target hosts: {{ target_hosts | default('tag_group_' ~ current_group) }}
            Remediation: PwnKit systemtap mitigation

            Workflow proceeding to create change request for approval gate.

    - name: Display incident details
      ansible.builtin.debug:
        msg: |
          === Incident Created ===
          Number: {{ inc_result.record.number }}
          Sys ID: {{ inc_result.record.sys_id }}
          Group: {{ current_group }}

    - name: Publish incident identifiers
      ansible.builtin.set_stats:
        data:
          inc_sys_id: "{{ inc_result.record.sys_id }}"
          inc_number: "{{ inc_result.record.number }}"
        aggregate: false
