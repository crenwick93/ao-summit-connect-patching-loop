---
# Recycle demo environment after a patching cycle completes.
# Triggered by EDA when it sees a closed CR matching "CVE Remediation".
#
# Flow: soak pause → deregister from Insights/RHSM → terminate EC2s →
#       relaunch from base AMI with cloud-init → register with Insights →
#       sync AAP inventory → fire AO webhook for next group.
#
# Battle-tested patterns ported from provision-hosts.sh.
#
# Expects:
#   current_group: A|B|C  (the group that was just patched — extracted by EDA from CR description)

- name: Soak and discover instances
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    _group: "{{ current_group | upper }}"
    _aws_region: "{{ aws_region | default(lookup('env', 'AWS_REGION')) | default('eu-west-1', true) }}"

  tasks:
    - name: "Soak period — wait before recycling Group {{ _group }}"
      ansible.builtin.pause:
        seconds: "{{ soak_seconds | default(0) }}"
      when: (soak_seconds | default(0) | int) > 0

    - name: "Find running instances for Group {{ _group }}"
      amazon.aws.ec2_instance_info:
        region: "{{ _aws_region }}"
        filters:
          "tag:demo": patching-loop
          "tag:group": "{{ _group }}"
          instance-state-name: running
      register: existing_instances

    - name: Display instances to recycle
      ansible.builtin.debug:
        msg: "Found {{ existing_instances.instances | length }} running instances for Group {{ _group }}"

    - name: Add existing hosts for deregistration
      ansible.builtin.add_host:
        name: "{{ item.public_ip_address }}"
        groups: deregister_hosts
        ansible_user: ec2-user
        ansible_become: true
        instance_name: "{{ item.tags.Name | default(item.instance_id) }}"
      loop: "{{ existing_instances.instances }}"
      loop_control:
        label: "{{ item.tags.Name | default(item.instance_id) }}"
      when: existing_instances.instances | length > 0

# ---------------------------------------------------------------------------
# Deregister — matches provision-hosts.sh deregistration pattern
# ---------------------------------------------------------------------------
- name: Deregister hosts from Insights and RHSM
  hosts: deregister_hosts
  become: true
  gather_facts: false
  ignore_unreachable: true

  tasks:
    - name: Deregister from Insights, RHC, and RHSM
      ansible.builtin.shell: |
        insights-client --unregister 2>/dev/null || true
        rhc disconnect 2>/dev/null || true
        subscription-manager unregister 2>/dev/null || true
      failed_when: false
      changed_when: true

# ---------------------------------------------------------------------------
# Terminate and relaunch — cloud-init masks services + sets hostname
# ---------------------------------------------------------------------------
- name: Terminate and relaunch instances
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    _group: "{{ current_group | upper }}"
    _aws_region: "{{ aws_region | default(lookup('env', 'AWS_REGION')) | default('eu-west-1', true) }}"
    _base_ami: "{{ base_ami_id | default('ami-016397d7dfea2bd03') }}"
    _instance_type: "{{ instance_type | default('t3.micro') }}"
    _subnet_id: "{{ subnet_id | default('subnet-0e20d6149a3cc75c3') }}"
    _sg_id: "{{ security_group_id | default('sg-05d455584d799b076') }}"
    _key_pair: "{{ key_pair_name | default('patching-demo') }}"
    _domain: "summit-demo.chrislab.dev"
    _group_hosts:
      A: ["summit-rhel-01", "summit-rhel-02", "summit-rhel-03"]
      B: ["summit-rhel-04", "summit-rhel-05", "summit-rhel-06"]
      C: ["summit-rhel-07", "summit-rhel-08", "summit-rhel-09"]

  tasks:
    - name: "Terminate Group {{ _group }} instances"
      amazon.aws.ec2_instance:
        region: "{{ _aws_region }}"
        instance_ids: "{{ existing_instances.instances | map(attribute='instance_id') | list }}"
        state: terminated
        wait: true
      when: existing_instances.instances | length > 0

    - name: Wait for termination to settle
      ansible.builtin.pause:
        seconds: 10
      when: existing_instances.instances | length > 0

    - name: "Launch 3 new instances for Group {{ _group }} with cloud-init"
      amazon.aws.ec2_instance:
        region: "{{ _aws_region }}"
        image_id: "{{ _base_ami }}"
        instance_type: "{{ _instance_type }}"
        key_name: "{{ _key_pair }}"
        vpc_subnet_id: "{{ _subnet_id }}"
        security_group: "{{ _sg_id }}"
        network_interfaces:
          - assign_public_ip: true
        tags:
          Name: "{{ item }}"
          demo: patching-loop
          group: "{{ _group }}"
        user_data: |
          #cloud-config
          bootcmd:
            - [ systemctl, mask, rhcd.service ]
            - [ systemctl, stop, rhcd.service ]
            - [ systemctl, mask, insights-client.timer ]
            - [ systemctl, mask, rhsmcertd.service ]
            - [ systemctl, stop, rhsmcertd.service ]
          runcmd:
            - hostnamectl set-hostname {{ item }}.{{ _domain }}
            - echo '{{ item }}.{{ _domain }}' > /etc/hostname
        wait: true
        state: running
      loop: "{{ _group_hosts[_group] }}"
      register: new_instances

    - name: Wait for SSH on new instances
      ansible.builtin.wait_for:
        host: "{{ item.instances[0].public_ip_address }}"
        port: 22
        delay: 10
        timeout: 300
        state: started
      loop: "{{ new_instances.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Add new hosts to inventory
      ansible.builtin.add_host:
        name: "{{ item.instances[0].public_ip_address }}"
        groups: new_hosts
        ansible_user: ec2-user
        ansible_become: true
        instance_name: "{{ item.item }}"
      loop: "{{ new_instances.results }}"
      loop_control:
        label: "{{ item.item }}"

# ---------------------------------------------------------------------------
# Register — matches provision-hosts.sh battle-tested registration pattern
# ---------------------------------------------------------------------------
- name: Register new hosts with Insights
  hosts: new_hosts
  become: true
  gather_facts: false

  vars:
    _rh_org_id: "{{ rh_org_id | default(lookup('env', 'RH_ORG_ID')) }}"
    _rh_activation_key: "{{ rh_activation_key | default(lookup('env', 'RH_ACTIVATION_KEY')) }}"

  tasks:
    - name: Wait for cloud-init to complete
      ansible.builtin.shell: cloud-init status --wait 2>/dev/null || sleep 30
      changed_when: false

    - name: Full registration sequence
      ansible.builtin.shell: |
        # Stop and mask auto-registration services
        systemctl stop rhcd.service 2>/dev/null || true
        systemctl disable rhcd.service 2>/dev/null || true
        systemctl mask rhcd.service 2>/dev/null || true
        systemctl stop rhsmcertd.service 2>/dev/null || true
        systemctl mask rhsmcertd.service 2>/dev/null || true
        sed -i 's/^auto_registration\s*=.*/auto_registration = 0/' /etc/rhsm/rhsm.conf 2>/dev/null || true

        # Clean slate — remove any stale registration state
        insights-client --unregister 2>/dev/null || true
        subscription-manager unregister 2>/dev/null || true
        rm -f /etc/insights-client/machine-id /etc/insights-client/.registered
        rm -rf /etc/pki/consumer/* /etc/pki/entitlement/*
        rm -rf /var/lib/rhsm/cache/* /var/lib/rhsm/facts/*

        # Register with RHSM
        subscription-manager register \
          --org='{{ _rh_org_id }}' \
          --activationkey='{{ _rh_activation_key }}' \
          --force 2>&1

        # Register with Insights
        insights-client --register 2>&1

        # Set Insights tags for grouping
        mkdir -p /etc/insights-client
        echo -e "---\ngroup: patching-loop" > /etc/insights-client/tags.yaml

        # Re-enable services for ongoing reporting
        systemctl unmask rhsmcertd.service 2>/dev/null || true
        systemctl enable --now rhsmcertd.service 2>/dev/null || true
        systemctl unmask insights-client.timer 2>/dev/null || true
        systemctl enable --now insights-client.timer 2>/dev/null || true

        # Final check-in to confirm
        insights-client 2>&1 | tail -1
      register: reg_result
      retries: 3
      delay: 15
      until: "'Successfully uploaded' in reg_result.stdout"
      when: _rh_org_id | length > 0

    - name: Verify Insights registration
      ansible.builtin.command: insights-client --status
      register: verify_result
      failed_when: "'confirms registration' not in verify_result.stdout"
      when: _rh_org_id | length > 0

# ---------------------------------------------------------------------------
# Sync AAP inventory + fire next group
# ---------------------------------------------------------------------------
- name: Sync inventory and fire next group
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    _current_group: "{{ current_group | upper }}"
    _group_rotation:
      A: B
      B: C
      C: A
    _next_group: "{{ _group_rotation[_current_group] }}"
    _stop_flag: /tmp/patching-loop-stop
    webhook_base_url: ""
    webhook_path: ""
    webhook_client_id: ""
    webhook_client_secret: ""

  tasks:
    - name: Check for stop flag
      ansible.builtin.stat:
        path: "{{ _stop_flag }}"
      register: stop_flag_check

    - name: Obtain OAuth token for AO webhook
      ansible.builtin.uri:
        url: "{{ webhook_base_url }}/api/v1/auth/token"
        method: POST
        body_format: form-urlencoded
        body:
          grant_type: client_credentials
          client_id: "{{ webhook_client_id }}"
          client_secret: "{{ webhook_client_secret }}"
        validate_certs: false
        status_code: 200
      register: token_response
      when: not stop_flag_check.stat.exists

    - name: Fire webhook to EDA for next group
      ansible.builtin.uri:
        url: "{{ webhook_base_url }}/api/v1/webhooks/eda/{{ webhook_path }}"
        method: POST
        body_format: json
        headers:
          Authorization: "Bearer {{ token_response.json.access_token }}"
          Content-Type: application/json
        body:
          current_group: "{{ _next_group }}"
          cve_id: "CVE-2021-4034"
          severity: 7.8
          advisory_id: "RHSA-2022:0274"
          force_route: ""
        validate_certs: false
        status_code: 202
      register: webhook_response
      when: not stop_flag_check.stat.exists

    - name: Display loop status
      ansible.builtin.debug:
        msg: >-
          {{ 'Loop continues: Group ' ~ _current_group ~ ' → Group ' ~ _next_group
             if not stop_flag_check.stat.exists
             else 'Loop stopped at Group ' ~ _current_group ~ '. Remove ' ~ _stop_flag ~ ' and run start-loop.sh to resume.' }}
