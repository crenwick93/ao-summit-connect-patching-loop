---
# Simplified fleet assessment for patching loop.
# Just verifies that the group's hosts are reachable and alive.
# No Insights API calls — this is a simpler loop context.

- name: Fleet Assessment
  hosts: all
  gather_facts: true

  tasks:
    - name: Verify host is reachable
      ansible.builtin.ping:

    - name: Display host info
      ansible.builtin.debug:
        msg: >-
          {{ inventory_hostname }} — {{ ansible_distribution | default('Unknown') }}
          {{ ansible_distribution_version | default('') }},
          {{ ansible_memtotal_mb | default('?') }} MB RAM,
          Kernel {{ ansible_kernel | default('?') }}

- name: Consolidate fleet assessment
  hosts: all
  gather_facts: false
  run_once: true

  vars:
    _checked_hosts: "{{ ansible_play_hosts_all | join(', ') }}"
    _host_count: "{{ ansible_play_hosts_all | length }}"

  tasks:
    - name: Display fleet assessment summary
      ansible.builtin.debug:
        msg: |
          === Fleet Assessment — Group {{ current_group | default('?') }} ===
          Hosts alive ({{ _host_count }}): {{ _checked_hosts }}
          All hosts reachable ✓

    - name: Determine remediation route
      ansible.builtin.set_fact:
        _route: "{{ force_route | default('') }}"

    - name: Auto-detect route when not forced
      ansible.builtin.set_fact:
        _route: "patch"
      when: _route | length == 0

    - name: Publish fleet assessment artifacts
      ansible.builtin.set_stats:
        data:
          current_group: "{{ current_group }}"
          target_hosts: "{{ _checked_hosts }}"
          host_count: "{{ _host_count }}"
          fleet_healthy: true
          remediation_route: "{{ _route }}"
          advisory_available: "{{ 'true' if _route in ['patch', 'mitigate'] else 'false' }}"
          cve_severity: "7.8"
          cve_description: "A local privilege escalation vulnerability was found in polkit's pkexec utility."
        aggregate: false
