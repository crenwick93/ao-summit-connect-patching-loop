---
# The loop closer: computes next group and fires a webhook back to EDA.
# This is the critical playbook that makes the loop self-perpetuating.
#
# Group rotation: A -> B -> C -> A -> ...
#
# Checks for a stop flag (/tmp/patching-loop-stop) — if present,
# the loop stops gracefully and does NOT fire the next webhook.

- name: Fire Next Group — Close the Patching Loop
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    _current_group: "{{ current_group | upper }}"
    _group_rotation:
      A: B
      B: C
      C: A
    _next_group: "{{ _group_rotation[_current_group] }}"
    _stop_flag: /tmp/patching-loop-stop

    webhook_base_url: ""
    webhook_path: ""
    webhook_client_id: ""
    webhook_client_secret: ""

  tasks:
    - name: Check for stop flag
      ansible.builtin.stat:
        path: "{{ _stop_flag }}"
      register: stop_flag_check
      delegate_to: localhost

    - name: Display stop flag status
      ansible.builtin.debug:
        msg: >-
          {{ 'STOP FLAG DETECTED — loop will NOT continue to Group ' ~ _next_group
             if stop_flag_check.stat.exists
             else 'No stop flag — loop will continue to Group ' ~ _next_group }}

    - name: Obtain OAuth token for AO webhook
      ansible.builtin.uri:
        url: "{{ webhook_base_url }}/api/v1/auth/token"
        method: POST
        body_format: form-urlencoded
        body:
          grant_type: client_credentials
          client_id: "{{ webhook_client_id }}"
          client_secret: "{{ webhook_client_secret }}"
        validate_certs: false
        status_code: 200
      register: token_response
      when: not stop_flag_check.stat.exists

    - name: Fire webhook to EDA for next group
      ansible.builtin.uri:
        url: "{{ webhook_base_url }}/api/v1/webhooks/eda/{{ webhook_path }}"
        method: POST
        body_format: json
        headers:
          Authorization: "Bearer {{ token_response.json.access_token }}"
          Content-Type: application/json
        body:
          current_group: "{{ _next_group }}"
        validate_certs: false
        status_code: 202
      register: webhook_response
      when: not stop_flag_check.stat.exists

    - name: Display loop continuation
      ansible.builtin.debug:
        msg: >-
          {{ 'Loop continues: Group ' ~ _current_group ~ ' → Group ' ~ _next_group
             ~ ' (execution: ' ~ webhook_response.json.execution_id ~ ')'
             if not stop_flag_check.stat.exists
             else 'Loop stopped at Group ' ~ _current_group ~ '. Remove ' ~ _stop_flag ~ ' and run start-loop.sh to resume.' }}
