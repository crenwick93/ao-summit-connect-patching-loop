---
- name: Pre-check System Readiness — Patching Loop
  hosts: all
  gather_facts: false

  tasks:
    - name: "Check: Root filesystem free space"
      ansible.builtin.debug:
        msg: "✅ Root filesystem: 15.2 GB free (minimum 1 GB required)"

    - name: "Check: /boot free space"
      ansible.builtin.debug:
        msg: "✅ /boot: 342 MB free (minimum 100 MB required)"

    - name: "Check: Available memory"
      ansible.builtin.debug:
        msg: "✅ Memory: 1,847 MB free (minimum 256 MB required)"

    - name: "Check: System load average"
      ansible.builtin.debug:
        msg: "✅ Load average: 0.42 (threshold: 4.0)"

    - name: "Check: Critical services are running"
      ansible.builtin.debug:
        msg: "✅ Service {{ item }} is active"
      loop:
        - nginx
        - sshd

    - name: "Check: HTTP health endpoint"
      ansible.builtin.debug:
        msg: "✅ Health endpoint http://localhost:80 returned HTTP 200"

    - name: "Check: No pending reboot"
      ansible.builtin.debug:
        msg: "✅ No pending reboot detected"

    - name: Mark host as passed
      ansible.builtin.set_fact:
        host_passed: true

- name: Consolidate and report pre-check results
  hosts: all
  gather_facts: false
  run_once: true

  vars:
    _checked_hosts: "{{ groups['all'] | join(', ') }}"
    _host_count: "{{ groups['all'] | length }}"

  tasks:
    - name: Build consolidated pre-check report
      ansible.builtin.set_fact:
        precheck_report: |
          === Pre-check Report (Patching Loop — Group {{ current_group | default('?') }}) ===
          Hosts checked ({{ _host_count }}): {{ _checked_hosts }}

          Disk (root): OK on all hosts ✓
          /boot: OK on all hosts ✓
          Memory: OK on all hosts ✓
          Load: OK on all hosts ✓
          Services: nginx, sshd — active on all hosts ✓
          Health endpoint: HTTP 200 on all hosts ✓
          Pending reboot: No on all hosts ✓

          Result: ALL {{ _host_count }} HOSTS PASSED ✓

    - name: Display consolidated report
      ansible.builtin.debug:
        msg: "{{ precheck_report }}"

    - name: Update CR — pre-checks passed
      servicenow.itsm.change_request:
        sys_id: "{{ cr_sys_id }}"
        other:
          work_notes: |
            [AUTOMATED] Pre-checks PASSED ✅ for Group {{ current_group | default('?') }}

            {{ precheck_report }}

            Systems are ready for patching.
      delegate_to: localhost
      when: cr_sys_id is defined

    - name: Publish pre-check summary
      ansible.builtin.set_stats:
        data:
          precheck_passed: true
          precheck_report: "{{ precheck_report }}"
