---
# =============================================================================
# AAP Configuration as Code — Patching Loop (Summit Connect Demo)
# =============================================================================
# Clean names (no prefix) — only two projects share this AAP instance.

# -----------------------------------------------------------------------------
# Custom Credential Types
# -----------------------------------------------------------------------------
controller_credential_types:
  - name: "ServiceNow Credential"
    description: "ServiceNow instance credentials for ITSM API"
    kind: cloud
    inputs:
      fields:
        - id: SN_HOST
          type: string
          label: "ServiceNow Instance URL"
        - id: SN_USERNAME
          type: string
          label: "Username"
        - id: SN_PASSWORD
          type: string
          label: "Password"
          secret: true
    injectors:
      env:
        SN_HOST: !unsafe "{{ SN_HOST }}"
        SN_USERNAME: !unsafe "{{ SN_USERNAME }}"
        SN_PASSWORD: !unsafe "{{ SN_PASSWORD }}"

  - name: "AO Webhook Credential"
    description: "OAuth2 service account for Automation Orchestrator EDA trigger"
    kind: cloud
    inputs:
      fields:
        - id: webhook_base_url
          type: string
          label: "AO Base URL"
        - id: webhook_client_id
          type: string
          label: "Service Account Client ID"
        - id: webhook_client_secret
          type: string
          label: "Service Account Client Secret"
          secret: true
    injectors:
      extra_vars:
        webhook_base_url: !unsafe "{{ webhook_base_url }}"
        webhook_client_id: !unsafe "{{ webhook_client_id }}"
        webhook_client_secret: !unsafe "{{ webhook_client_secret }}"

  - name: "AO API Credential"
    description: "Service account for AO REST API — bridges SNOW CR approval to AO approval gate"
    kind: cloud
    inputs:
      fields:
        - id: ao_sa_client_id
          type: string
          label: "AO Service Account Client ID"
        - id: ao_sa_client_secret
          type: string
          label: "AO Service Account Client Secret"
          secret: true
        - id: ao_base_url
          type: string
          label: "AO Base URL"
    injectors:
      extra_vars:
        ao_sa_client_id: !unsafe "{{ ao_sa_client_id }}"
        ao_sa_client_secret: !unsafe "{{ ao_sa_client_secret }}"
        ao_base_url: !unsafe "{{ ao_base_url }}"

  - name: "GitHub API Token"
    description: "Personal access token for GitHub API operations"
    kind: cloud
    inputs:
      fields:
        - id: github_token
          type: string
          label: "GitHub Token"
          secret: true
    injectors:
      env:
        GITHUB_TOKEN: !unsafe "{{ github_token }}"

  - name: "Lightspeed API Credential"
    description: "OAuth2 client credentials for Red Hat Lightspeed Remediations API"
    kind: cloud
    inputs:
      fields:
        - id: lightspeed_client_id
          type: string
          label: "Client ID"
        - id: lightspeed_client_secret
          type: string
          label: "Client Secret"
          secret: true
    injectors:
      env:
        LIGHTSPEED_CLIENT_ID: !unsafe "{{ lightspeed_client_id }}"
        LIGHTSPEED_CLIENT_SECRET: !unsafe "{{ lightspeed_client_secret }}"

  - name: "RHSM Registration Credential"
    description: "Red Hat subscription org ID and activation key for Insights registration"
    kind: cloud
    inputs:
      fields:
        - id: rh_org_id
          type: string
          label: "Red Hat Org ID"
        - id: rh_activation_key
          type: string
          label: "Activation Key"
          secret: true
    injectors:
      env:
        RH_ORG_ID: !unsafe "{{ rh_org_id }}"
        RH_ACTIVATION_KEY: !unsafe "{{ rh_activation_key }}"

# -----------------------------------------------------------------------------
# Credentials
# -----------------------------------------------------------------------------
controller_credentials:
  - name: "SSH Key"
    description: "SSH access to patching loop EC2 instances (ec2-user)"
    organization: "Default"
    credential_type: "Machine"
    inputs:
      username: ec2-user
      ssh_key_data: "{{ probe_ssh_key }}"

  - name: "AWS"
    description: "AWS credentials for dynamic EC2 inventory and instance management"
    organization: "Default"
    credential_type: "Amazon Web Services"
    inputs:
      username: "{{ aws_access_key }}"
      password: "{{ aws_secret_key }}"

  - name: "ServiceNow"
    description: "ServiceNow developer instance for ITSM integration"
    organization: "Default"
    credential_type: "ServiceNow Credential"
    inputs:
      SN_HOST: "{{ servicenow_instance_url }}"
      SN_USERNAME: "{{ servicenow_username }}"
      SN_PASSWORD: "{{ servicenow_password }}"

  - name: "AAP Controller"
    description: "Controller credential for internal workflow operations"
    organization: "Default"
    credential_type: "Red Hat Ansible Automation Platform"
    inputs:
      host: "{{ aap_hostname | regex_replace('/+$','') }}"
      oauth_token: "{{ aap_token }}"
      verify_ssl: "{{ aap_validate_certs }}"

  - name: "AO Webhook"
    description: "OAuth2 credentials for AO EDA trigger endpoint"
    organization: "Default"
    credential_type: "AO Webhook Credential"
    inputs:
      webhook_base_url: "{{ ao_webhook_base_url }}"
      webhook_client_id: "{{ ao_webhook_client_id }}"
      webhook_client_secret: "{{ ao_webhook_client_secret }}"

  - name: "AO API"
    description: "Service account for AO REST API — bridges SNOW CR approval to AO approval gate"
    organization: "Default"
    credential_type: "AO API Credential"
    inputs:
      ao_sa_client_id: "{{ ao_webhook_client_id }}"
      ao_sa_client_secret: "{{ ao_webhook_client_secret }}"
      ao_base_url: "{{ ao_webhook_base_url }}"

  - name: "GitHub Token"
    description: "GitHub PAT for committing Lightspeed-fetched playbooks"
    organization: "Default"
    credential_type: "GitHub API Token"
    inputs:
      github_token: "{{ github_token }}"

  - name: "Lightspeed API"
    description: "OAuth2 credentials for Lightspeed Remediations API"
    organization: "Default"
    credential_type: "Lightspeed API Credential"
    inputs:
      lightspeed_client_id: "{{ lightspeed_client_id }}"
      lightspeed_client_secret: "{{ lightspeed_client_secret }}"

  - name: "RHSM Registration"
    description: "Red Hat org ID and activation key for Insights registration"
    organization: "Default"
    credential_type: "RHSM Registration Credential"
    inputs:
      rh_org_id: "{{ rh_org_id }}"
      rh_activation_key: "{{ rh_activation_key }}"

  # --- Cleanup: delete old "Loop - " prefixed credentials ---
  - name: "Loop - SSH Key"
    organization: "Default"
    credential_type: "Machine"
    state: absent
  - name: "Loop - AWS"
    organization: "Default"
    credential_type: "Amazon Web Services"
    state: absent
  - name: "Loop - ServiceNow"
    organization: "Default"
    credential_type: "ServiceNow Credential"
    state: absent
  - name: "Loop - AAP Controller"
    organization: "Default"
    credential_type: "Red Hat Ansible Automation Platform"
    state: absent
  - name: "Loop - AO Webhook"
    organization: "Default"
    credential_type: "AO Webhook Credential"
    state: absent
  - name: "Loop - AO API"
    organization: "Default"
    credential_type: "AO API Credential"
    state: absent
  - name: "Loop - GitHub Token"
    organization: "Default"
    credential_type: "GitHub API Token"
    state: absent
  - name: "Loop - Lightspeed API"
    organization: "Default"
    credential_type: "Lightspeed API Credential"
    state: absent

# -----------------------------------------------------------------------------
# Projects
# -----------------------------------------------------------------------------
controller_projects:
  - name: "Patching Loop"
    description: "Playbooks and rulebooks for Summit Connect patching loop demo"
    organization: "Default"
    scm_type: "git"
    scm_url: "{{ git_repo_url }}"
    scm_branch: "main"
    scm_update_on_launch: true

  - name: "Lightspeed-Playbooks"
    description: "Dynamically fetched patching playbooks from Red Hat Lightspeed"
    organization: "Default"
    scm_type: "git"
    scm_url: "{{ git_repo_url }}"
    scm_branch: "main"
    scm_update_on_launch: true

  # --- Cleanup: delete old "Loop - " prefixed project ---
  - name: "Loop - Lightspeed-Playbooks"
    organization: "Default"
    state: absent

# -----------------------------------------------------------------------------
# Inventories
# -----------------------------------------------------------------------------
controller_inventories:
  - name: "Patching Loop Lab"
    description: "EC2 instances for patching loop demo (9 hosts, 3 groups)"
    organization: "Default"

# -----------------------------------------------------------------------------
# Inventory Sources (dynamic — AWS EC2)
# -----------------------------------------------------------------------------
controller_inventory_sources:
  - name: "AWS EC2 Discovery"
    inventory: "Patching Loop Lab"
    source: "ec2"
    credential: "AWS"
    overwrite: true
    update_on_launch: true
    source_vars:
      plugin: amazon.aws.aws_ec2
      regions:
        - eu-west-1
      filters:
        "tag:demo": patching-loop
      hostnames:
        - tag:Name
      keyed_groups:
        - key: tags.group
          prefix: tag_group
      compose:
        ansible_host: public_ip_address
        ansible_user: "'ec2-user'"
        ansible_become: "true"

  # --- Cleanup: delete old "Loop - " prefixed inventory source ---
  - name: "Loop - AWS EC2 Discovery"
    inventory: "Patching Loop Lab"
    state: absent

# -----------------------------------------------------------------------------
# Job Templates (12 — matching AO workflow nodes)
# -----------------------------------------------------------------------------
controller_templates:
  - name: "Trigger AO Workflow"
    description: "EDA-to-AO bridge: OAuth2 token + POST to AO EDA trigger endpoint"
    organization: "Default"
    job_type: "run"
    project: "Patching Loop"
    playbook: "playbooks/trigger_ao_workflow.yml"
    inventory: "Patching Loop Lab"
    ask_variables_on_launch: true
    credentials:
      - "AO Webhook"

  - name: "Fleet Assessment"
    description: "Verify group hosts are alive and reachable"
    organization: "Default"
    job_type: "run"
    project: "Patching Loop"
    playbook: "playbooks/fleet_assessment.yml"
    inventory: "Patching Loop Lab"
    ask_variables_on_launch: true
    ask_limit_on_launch: true
    credentials:
      - "SSH Key"

  - name: "Manage Change Request"
    description: "Create, update, review, or close change requests in ServiceNow"
    organization: "Default"
    job_type: "run"
    project: "Patching Loop"
    playbook: "playbooks/snow_manage_change_request.yml"
    inventory: "Patching Loop Lab"
    ask_variables_on_launch: true
    credentials:
      - "ServiceNow"

  - name: "Bridge AO Approval"
    description: "Bridges ServiceNow CR approval to AO workflow approval gate via AO REST API"
    organization: "Default"
    job_type: "run"
    project: "Patching Loop"
    playbook: "playbooks/bridge_ao_approval.yml"
    inventory: "Patching Loop Lab"
    ask_variables_on_launch: true
    credentials:
      - "AO API"

  - name: "Fetch and Commit"
    description: "Fetches patching playbook from Lightspeed Remediations API and commits to GitHub"
    organization: "Default"
    job_type: "run"
    project: "Patching Loop"
    playbook: "playbooks/fetch_and_commit.yml"
    inventory: "Patching Loop Lab"
    ask_variables_on_launch: true
    credentials:
      - "GitHub Token"
      - "Lightspeed API"

  - name: "Sync and Deploy"
    description: "Syncs Lightspeed project, creates scoped job template for the fetched playbook"
    organization: "Default"
    job_type: "run"
    project: "Patching Loop"
    playbook: "playbooks/sync_and_deploy.yml"
    inventory: "Patching Loop Lab"
    ask_variables_on_launch: true
    credentials:
      - "SSH Key"
      - "AAP Controller"
      - "ServiceNow"

  - name: "Pre-check"
    description: "System readiness checks before patching"
    organization: "Default"
    job_type: "run"
    project: "Patching Loop"
    playbook: "playbooks/precheck.yml"
    inventory: "Patching Loop Lab"
    ask_variables_on_launch: true
    ask_limit_on_launch: true
    credentials:
      - "SSH Key"
      - "ServiceNow"

  - name: "Run Mitigation"
    description: "Apply PwnKit (CVE-2021-4034) systemtap mitigation (fallback)"
    organization: "Default"
    job_type: "run"
    project: "Patching Loop"
    playbook: "mitigation-playbooks/CVE-2021-4034_polkit_mitigate.yml"
    inventory: "Patching Loop Lab"
    ask_variables_on_launch: true
    ask_limit_on_launch: true
    credentials:
      - "SSH Key"

  - name: "Post-check"
    description: "Post-remediation validation"
    organization: "Default"
    job_type: "run"
    project: "Patching Loop"
    playbook: "playbooks/postcheck.yml"
    inventory: "Patching Loop Lab"
    ask_variables_on_launch: true
    ask_limit_on_launch: true
    credentials:
      - "SSH Key"
      - "ServiceNow"

  - name: "Recycle Environment"
    description: "Soak, reset EC2 instances, register with Insights, and fire next group webhook"
    organization: "Default"
    job_type: "run"
    project: "Patching Loop"
    playbook: "playbooks/recycle_environment.yml"
    inventory: "Patching Loop Lab"
    ask_variables_on_launch: true
    extra_vars:
      webhook_path: "{{ ao_webhook_path }}"
    credentials:
      - "AWS"
      - "SSH Key"
      - "AO Webhook"
      - "RHSM Registration"

  # --- Cleanup: delete old "Loop - " prefixed templates ---
  - name: "Loop - Trigger AO Workflow"
    organization: "Default"
    state: absent
  - name: "Loop - Fleet Assessment"
    organization: "Default"
    state: absent
  - name: "Loop - Manage Change Request"
    organization: "Default"
    state: absent
  - name: "Loop - Bridge AO Approval"
    organization: "Default"
    state: absent
  - name: "Loop - Fetch and Commit"
    organization: "Default"
    state: absent
  - name: "Loop - Sync and Deploy"
    organization: "Default"
    state: absent
  - name: "Loop - Pre-check"
    organization: "Default"
    state: absent
  - name: "Loop - Run Mitigation"
    organization: "Default"
    state: absent
  - name: "Loop - Post-check"
    organization: "Default"
    state: absent
  - name: "Loop - Recycle Environment"
    organization: "Default"
    state: absent

# =============================================================================
# Event-Driven Ansible
# =============================================================================

# -----------------------------------------------------------------------------
# EDA Custom Credential Types
# -----------------------------------------------------------------------------
eda_credential_types:
  - name: "ServiceNow Credential"
    description: "ServiceNow instance credentials for EDA source plugins"
    inputs:
      fields:
        - id: SN_HOST
          type: string
          label: "ServiceNow Instance URL"
        - id: SN_USERNAME
          type: string
          label: "Username"
        - id: SN_PASSWORD
          type: string
          label: "Password"
          secret: true
    injectors:
      env:
        SN_HOST: !unsafe "{{ SN_HOST }}"
        SN_USERNAME: !unsafe "{{ SN_USERNAME }}"
        SN_PASSWORD: !unsafe "{{ SN_PASSWORD }}"

# -----------------------------------------------------------------------------
# EDA Decision Environments
# -----------------------------------------------------------------------------
eda_decision_environments:
  - name: "Patching Loop DE"
    description: "ServiceNow-enabled DE for patching loop (webhook + CR polling)"
    organization: "Default"
    image_url: "quay.io/crenwick93/snow-de:latest"

# -----------------------------------------------------------------------------
# EDA Projects
# -----------------------------------------------------------------------------
eda_projects:
  - name: "Patching Loop"
    description: "EDA rulebooks for patching loop"
    organization: "Default"
    url: "{{ git_repo_url }}"
    wait: true

# -----------------------------------------------------------------------------
# EDA Credentials
# -----------------------------------------------------------------------------
eda_credentials:
  - name: "AAP Controller Token"
    description: "Controller credential so EDA can launch job templates"
    credential_type: "Red Hat Ansible Automation Platform"
    organization: "Default"
    inputs:
      host: "http://aap.aap-operator.svc.cluster.local/api/controller/"
      oauth_token: "{{ aap_token }}"
      verify_ssl: false

  - name: "ServiceNow EDA"
    description: "ServiceNow credentials for EDA CR polling source"
    credential_type: "ServiceNow Credential"
    organization: "Default"
    inputs:
      SN_HOST: "{{ servicenow_instance_url }}"
      SN_USERNAME: "{{ servicenow_username }}"
      SN_PASSWORD: "{{ servicenow_password }}"

  - name: "Webhook Token"
    description: "Token auth for patching loop webhook events"
    credential_type: "Token Event Stream"
    organization: "Default"
    inputs:
      auth_type: token
      token: "{{ eda_event_stream_token }}"
      http_header_key: Authorization

  # --- Cleanup: delete old "Loop - " prefixed EDA credentials ---
  - name: "Loop - AAP Controller Token"
    credential_type: "Red Hat Ansible Automation Platform"
    organization: "Default"
    state: absent
  - name: "Loop - ServiceNow EDA"
    credential_type: "ServiceNow Credential"
    organization: "Default"
    state: absent
  - name: "Loop - Webhook Token"
    credential_type: "Token Event Stream"
    organization: "Default"
    state: absent

# -----------------------------------------------------------------------------
# Event Streams
# -----------------------------------------------------------------------------
eda_event_streams:
  - name: "Patching Loop Events"
    organization: "Default"
    credential_name: "Webhook Token"
    event_stream_type: token
    forward_events: true
    test_mode: false

# -----------------------------------------------------------------------------
# Rulebook Activations
# -----------------------------------------------------------------------------
eda_rulebook_activations:
  - name: "Patching Loop"
    description: "Monitors webhook for group triggers + ServiceNow CR approvals"
    organization: "Default"
    project: "Patching Loop"
    rulebook: "patching_loop.yml"
    decision_environment: "Patching Loop DE"
    enabled: true
    extra_vars:
      webhook_path: "{{ ao_webhook_path }}"
    source_mappings:
      - source_name: loop_webhook
        event_stream_name: "Patching Loop Events"
    eda_credentials:
      - "AAP Controller Token"
      - "ServiceNow EDA"
